name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public runtime configuration
        env:
          MARKET_API_BASE_URL: ${{ vars.MARKET_API_BASE_URL }}
        shell: bash
        run: |
          if [ -z "${MARKET_API_BASE_URL:-}" ]; then
            echo "::error title=Missing GitHub Actions variable::MARKET_API_BASE_URL is not configured for this repository. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          node scripts/build-runtime-config.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
